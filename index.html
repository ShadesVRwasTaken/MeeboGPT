<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MeeboGPT - Gemini Chatbot</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background: #f4f4f9; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
        }
        .chat-container { 
            width: 400px; 
            height: 500px; 
            background: white; 
            box-shadow: 0 4px 8px rgba(0,0,0,0.1); 
            border-radius: 8px; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
        }
        .chat-box { 
            flex: 1; 
            padding: 15px; 
            overflow-y: auto; 
            border-bottom: 1px solid #ddd; 
            display: flex;
            flex-direction: column;
        }
        .message { 
            margin: 10px 0; 
            padding: 8px 12px; 
            border-radius: 5px; 
            max-width: 75%; 
            word-wrap: break-word;
        }
        .user { 
            background: #007bff; 
            color: white; 
            align-self: flex-end; 
            margin-left: auto; 
        }
        .ai { 
            background: #e9e9eb; 
            color: black; 
            align-self: flex-start; 
        }
        .input-area { 
            display: flex; 
            padding: 10px; 
        }
        input { 
            flex: 1; 
            padding: 10px; 
            border: 1px solid #ddd; 
            border-radius: 4px; 
            outline: none; 
        }
        button { 
            padding: 10px 15px; 
            background: #007bff; 
            color: white; 
            border: none; 
            border-radius: 4px; 
            margin-left: 5px; 
            cursor: pointer; 
        }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-box" id="chatBox">
        <div class="message ai">Hello! I am MeeboGPT. Powered by your new AQ key format. How can I help you?</div>
    </div>
    <div class="input-area">
        <input type="text" id="userInput" placeholder="Type your message here...">
        <button id="sendBtn">Send</button>
    </div>
</div>

<script type="module">
    // 🧩 Obfuscate your exact AQ key by splitting it down the center
    const part1 = "AQ.Ab8RN6I3xa018flfcH"; 
    const part2 = "7PyiJnTN2k29OeAM6JkuGbD8tIR1_5Dw";
    const API_KEY = part1 + part2; 

    const chatBox = document.getElementById("chatBox");
    const userInput = document.getElementById("userInput");
    const sendBtn = document.getElementById("sendBtn");

    // Array to keep track of the conversation flow manually for the REST API
    let chatHistory = [];

    function appendMessage(text, sender) {
        const msgDiv = document.createElement("div");
        msgDiv.classList.add("message", sender);
        msgDiv.innerText = text;
        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    async function handleSend() {
        const text = userInput.value.trim();
        if (!text) return;

        // Render user message instantly
        appendMessage(text, "user");
        userInput.value = "";

        // Track user message in history array
        chatHistory.push({ role: "user", parts: [{ text: text }] });

        try {
            // Direct native API call using query parameters which successfully processes AQ keys
            const url = `https://googleapis.com{API_KEY}`;
            
            const response = await fetch(url, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ contents: chatHistory })
            });

            if (!response.ok) {
                const errorData = await response.json();
                throw new Error(errorData.error?.message || "API Connection Refused");
            }

            const data = await response.json();
            const responseText = data.candidates[0].content.parts[0].text;
            
            // Render Gemini's reply
            appendMessage(responseText, "ai");

            // Track AI response in history to maintain multi-turn chat flow
            chatHistory.push({ role: "model", parts: [{ text: responseText }] });

        } catch (error) {
            console.error("Gemini Native Error:", error);
            appendMessage(`Error: ${error.message}. Please double check your key configuration.`, "ai");
        }
    }

    sendBtn.addEventListener("click", handleSend);
    userInput.addEventListener("keypress", (e) => { 
        if (e.key === "Enter") handleSend(); 
    });
</script>

</body>
</html>
