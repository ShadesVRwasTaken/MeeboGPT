<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini AI Chatbot</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background: #f4f4f9; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
        }
        .chat-container { 
            width: 400px; 
            height: 500px; 
            background: white; 
            box-shadow: 0 4px 8px rgba(0,0,0,0.1); 
            border-radius: 8px; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
        }
        .chat-box { 
            flex: 1; 
            padding: 15px; 
            overflow-y: auto; 
            border-bottom: 1px solid #ddd; 
            display: flex;
            flex-direction: column;
        }
        .message { 
            margin: 10px 0; 
            padding: 8px 12px; 
            border-radius: 5px; 
            max-width: 75%; 
            word-wrap: break-word;
        }
        .user { 
            background: #007bff; 
            color: white; 
            align-self: flex-end; 
            margin-left: auto; 
        }
        .ai { 
            background: #e9e9eb; 
            color: black; 
            align-self: flex-start; 
        }
        .input-area { 
            display: flex; 
            padding: 10px; 
        }
        input { 
            flex: 1; 
            padding: 10px; 
            border: 1px solid #ddd; 
            border-radius: 4px; 
            outline: none; 
        }
        button { 
            padding: 10px 15px; 
            background: #007bff; 
            color: white; 
            border: none; 
            border-radius: 4px; 
            margin-left: 5px; 
            cursor: pointer; 
        }
    </style>
    
    <!-- Load the official Google Gemini SDK via ESM -->
    <script type="importmap">
    {
        "imports": {
            "@google/generative-ai": "https://esm.run"
        }
    }
    </script>
</head>
<body>

<div class="chat-container">
    <div class="chat-box" id="chatBox">
        <div class="message ai">Hello! I am your Gemini assistant. How can I help you today?</div>
    </div>
    <div class="input-area">
        <input type="text" id="userInput" placeholder="Type your message here...">
        <button id="sendBtn">Send</button>
    </div>
</div>

<script type="module">
    import { GoogleGenerativeAI } from "@google/generative-ai";

    // 🧩 Obfuscation technique: Splitting your specific key right down the middle
    const part1 = "AQ.Ab8RN6I3xa018flfcH7PyiJn"; 
    const part2 = "TN2k29OeAM6JkuGbD8tIR1_5Dw";

    // Reassemble the key dynamically at runtime
    const API_KEY = part1 + part2; 

    // Initialize the Gemini SDK using the unified key string
    const genAI = new GoogleGenerativeAI(API_KEY);
    const model = genAI.getGenerativeModel({ model: "gemini-2.5-flash" });
    const chatSession = model.startChat({ history: [] });

    const chatBox = document.getElementById("chatBox");
    const userInput = document.getElementById("userInput");
    const sendBtn = document.getElementById("sendBtn");

    function appendMessage(text, sender) {
        const msgDiv = document.createElement("div");
        msgDiv.classList.add("message", sender);
        msgDiv.innerText = text;
        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    async function handleSend() {
        const text = userInput.value.trim();
        if (!text) return;

        appendMessage(text, "user");
        userInput.value = "";

        try {
            const result = await chatSession.sendMessage(text);
            const responseText = await result.response.text();
            appendMessage(responseText, "ai");
        } catch (error) {
            console.error("Gemini Error:", error);
            appendMessage("Error generating response. Your key structure may require Vertex AI or specialized API initializations.", "ai");
        }
    }

    sendBtn.addEventListener("click", handleSend);
    userInput.addEventListener("keypress", (e) => { 
        if (e.key === "Enter") handleSend(); 
    });
</script>

</body>
</html>
